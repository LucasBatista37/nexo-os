name: ci

on:
  push:
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-test-boot:
    name: lint, testes de host, imagem e boot em QEMU
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Dependências do sistema (QEMU, OVMF, mtools)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 ovmf mtools

      - name: Toolchain Rust fixada (rust-toolchain.toml)
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --no-modify-path --default-toolchain none
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" toolchain install   # canal, targets e componentes de rust-toolchain.toml
          "$HOME/.cargo/bin/rustup" show

      - name: Cache do cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            kernel/target
            boot/loader/target
          key: cargo-${{ runner.os }}-${{ hashFiles('rust-toolchain.toml', '**/Cargo.lock') }}

      - name: Verificar toolchain
        run: tools/check-toolchain

      - name: Lint (fmt + clippy)
        run: make lint
      - name: IDL em dia (abi/proto gerado)
        run: make idl-check

      - name: Testes de host
        run: cargo test --workspace

      - name: Gerar imagem
        run: tools/build-image --cmdline ""

      - name: Boot em QEMU e cenários de falha (serial)
        run: tools/test-qemu --no-build --timeout 180

      - name: Reprodutibilidade da imagem
        run: make reproducible

      - name: Artefatos
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nexo-${{ github.sha }}
          path: |
            build/nexo.img
            build/kernel.elf
            build/kernel.sym
            build/BOOTX64.EFI
            build/logs/*.log
          if-no-files-found: warn
