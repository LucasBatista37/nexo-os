[package]
name = "nexo-loader"
description = "Loader UEFI do Nexo OS: carrega o kernel ELF, constroi as tabelas de pagina e entrega o BootInfo"
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

# Workspace proprio: alvo x86_64-unknown-uefi (ver .cargo/config.toml).
[workspace]

[dependencies]
uefi = { version = "0.35", features = ["alloc", "global_allocator", "logger", "panic_handler"] }
log = "0.4"
nexo-boot-abi = { path = "../../abi/boot" }
nexo-mm = { path = "../../kernel/lib/mm" }
nexo-arch-x86_64 = { path = "../../arch/x86_64" }
nexo-elf = { path = "../../kernel/lib/elf" }

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1
# Sem debuginfo: evita caminhos absolutos no PE (imagem independente do checkout).
debug = false
strip = "debuginfo"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
