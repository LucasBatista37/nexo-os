[package]
name = "nexo-vfs"
description = "VFS com namespace por instancia: monta o NexoFS (/disk), a ESP (/boot, so leitura) e um ramfs (/tmp) sob um unico protocolo nexo.fs"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
nexo-sys.workspace = true
nexo-rt = { workspace = true, features = ["panic-handler"] }
nexo-proto.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
