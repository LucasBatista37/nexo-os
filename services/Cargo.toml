# Workspace dos programas de usuario (alvo x86_64-unknown-none em ring 3, ver .cargo/config.toml).
[workspace]
resolver = "2"
members = ["init", "svcmgr", "echo", "echo-client", "utest", "blockdev", "fs", "rngdev", "devmgr", "espfs", "vfs", "consoledev", "shell", "inputdev", "netdev", "netd", "wm", "greeter", "shellui", "calc", "config", "monitor", "term", "visor", "agenda", "lanc", "editor", "arquivos"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.98"

[workspace.dependencies]
nexo-sys = { path = "../sdk/nexo-sys" }
nexo-rt = { path = "../sdk/nexo-rt" }
nexofs = { path = "../libraries/nexofs" }
nexo-virtio = { path = "../libraries/virtio" }
nexo-fat = { path = "../libraries/fat" }
nexo-proto = { path = "../abi/proto" }
nexo-netstack = { path = "../libraries/net" }
nexo-net = { path = "../sdk/nexo-net" }
nexo-gfx = { path = "../libraries/gfx" }
nexo-font = { path = "../libraries/font" }
nexo-wm = { path = "../libraries/wm" }
nexo-ui = { path = "../libraries/ui" }
nexo-pkg = { path = "../libraries/pkg" }
nexo-inst = { path = "../libraries/inst" }
nexo-img = { path = "../libraries/img" }
nexo-cal = { path = "../libraries/cal" }
nexo-textgrid = { path = "../libraries/textgrid" }

[profile.dev]
panic = "abort"
opt-level = 1

[profile.release]
panic = "abort"
opt-level = 2
codegen-units = 1
debug = false
strip = "debuginfo"
