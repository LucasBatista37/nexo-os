[package]
name = "nexo-shellui"
description = "Shell grafico do Nexo OS (Faixa de Atividades): barra de janelas desenhada com nexo-ui na sessao privilegiada do compositor; clique numa celula ativa a janela; faz broker de sessoes nexo.wm para os apps"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
nexo-sys.workspace = true
nexo-rt = { workspace = true, features = ["panic-handler"] }
nexo-proto.workspace = true
nexo-gfx.workspace = true
nexo-ui.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
