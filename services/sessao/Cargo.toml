[package]
name = "nexo-sessao"
description = "Orquestrador da sessao grafica do Nexo OS: liga os drivers de entrada ao compositor, sobe a Faixa de Atividades, exige o login pelo greeter e abre o terminal com o shell — o sistema a arrancar em si mesmo"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
nexo-sys.workspace = true
nexo-rt = { workspace = true, features = ["panic-handler"] }
nexo-proto.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
