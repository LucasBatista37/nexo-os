[package]
name = "nexo-config"
description = "Configuracoes do Nexo OS: janela com toggles reais (movimento reduzido, nao-perturbe) acionados por clique — a posse da entrada vem do proprio clique, entao as APIs mediadas funcionam"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[dependencies]
nexo-sys.workspace = true
nexo-rt = { workspace = true, features = ["panic-handler"] }
nexo-proto.workspace = true
nexo-gfx.workspace = true
nexo-ui.workspace = true

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
